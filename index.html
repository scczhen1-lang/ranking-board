 <style>
 :root { 
 --primary-color: #008f00; 
 --secondary-color: #111111; 
 --bg-color: #eef2f7; 
 --card-bg: #ffffff; 
 }
 * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif; }
 
 body { 
 background-color: var(--bg-color); 
 color: var(--secondary-color); 
 padding-bottom: 40px; 
 font-size: 1.15rem; 
 line-height: 1.5;
 }
 header { background: linear-gradient(135deg, var(--primary-color), #007700); color: white; padding: 18px 15px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.15); }
 h1 { font-size: 1.6rem; font-weight: 900; margin-bottom: 0px; }
 
 .tabs { 
 display: flex; 
 background: white; 
 margin: 15px 0; 
 border-radius: 0; 
 overflow: hidden; 
 box-shadow: 0 3px 6px rgba(0,0,0,0.1); 
 width: 100%; 
 border-left: none;
 border-right: none;
 border-top: 1px solid #ccc;
 border-bottom: 1px solid #ccc;
 }
 .tab-btn { flex: 1; width: 50%; padding: 16px 10px; text-align: center; background: none; border: none; font-size: 1.25rem; font-weight: 900; color: #444; cursor: pointer; display: block;}
 .tab-btn.active { background-color: var(--primary-color) !important; color: white !important;}
 
 .container { padding: 0; }
 .content-panel { display: none; }
 .content-panel.active { display: block; }
 .rank-card { 
 background: var(--card-bg); 
 border-radius: 0; 
 padding: 18px 15px; 
 margin-bottom: 10px; 
 border: none; 
 border-bottom: 1px solid #e5e7eb; 
 box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05); 
 cursor: pointer; 
 width: 100%;
 }
 .card-main-content { display: flex; align-items: center; }
 
 .rank-num { 
 font-size: 1.6rem; 
 font-weight: 900; 
 min-width: 55px; 
 max-width: 55px;
 height: 55px;
 line-height: 51px; 
 text-align: center; 
 margin-right: 15px; 
 color: #333; 
 background: #e6e6e6; 
 border-radius: 50%;
 border: 2px solid #ccc;
 }
.rank-1 { background: linear-gradient(135deg, #ffd700, #ffa500); color: #000000; font-size: 2.1rem; border: 3px solid #b58600; box-shadow: inset 0 2px 4px rgba(255,255,255,0.4); }
.rank-2 { background: linear-gradient(135deg, #f0f0f0, #b0b0b0); color: #000000; border: 3px solid #777;}
.rank-3 { background: linear-gradient(135deg, #f4a460, #cd7f32); color: #000000; border: 3px solid #8b4513;}
 .info-box { flex: 1; }
 .name-main { font-size: 1.4rem; font-weight: 900; color: #000000; line-height: 1.4; }
 .name-container { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
 
 .team-tag { 
 font-size: 1.05rem;
 color: #000000 !important; 
 background-color: #ffe082 !important; 
 padding: 4px 14px; 
 border-radius: 20px; 
 font-weight: 900 !important; 
 border: 2px solid #000000; 
 }
 
 .sub-detail { font-size: 1.05rem; font-weight: bold; color: #444; white-space: normal; word-break: break-all; line-height: 1.5; }
 .score-box { text-align: right; min-width: 85px; }
 .score-num { font-size: 1.8rem; font-weight: 900; color: var(--primary-color); } 
 .score-unit { font-size: 1rem; font-weight: bold; color: #333; margin-left: 1px; }

 .chart-card { 
 background: var(--card-bg); 
 border-radius: 0; 
 padding: 18px 15px; 
 margin-bottom: 15px; 
 box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
 border: none;
 border-bottom: 1px solid #e5e7eb;
 width: 100%;
 }
 .chart-title { font-size: 1.2rem; font-weight: 900; margin-bottom: 14px; color: #111; border-left: 6px solid var(--primary-color); padding-left: 10px; }
 .chart-row { display: block; margin-bottom: 4px; width: 100%; }
 .chart-axis-label { width: 100% !important; max-width: none !important; min-width: 0 !important; font-weight: 900; font-size: 1.0rem; color: #000000; text-align: left; margin-bottom: 0px; padding-left: 2px; line-height: 1.1; }
 .chart-bar-flex-group { display: flex; align-items: center; width: 100%; height: 30px; }
 .chart-bar-area { flex: 1; position: relative; width: 0; }
 .stacked-bar-container { background: #dddddd; border-radius: 4px; overflow: hidden; display: flex; height: 24px; width: 100%; border: 0px solid #333; background-image: linear-gradient(to bottom, rgba(255,255,255,0.15) 0%, rgba(0,0,0,0.05) 100%);}
 .chart-row-score { min-width: 70px; text-align: right; padding-left: 6px; font-weight: 900; font-size: 1.3rem; color: var(--primary-color); line-height: 30px; }
 
 .r-color-1 { background-color: #00BFFF; } 
 .r-color-2 { background-color: #FF3AD8; } 
 .r-color-3 { background-color: #29FF14; } 
 .r-color-4 { background-color: #FF1437; } 
 .r-color-5 { background-color: #A632FF; } 
 .r-color-6 { background-color: #FFCD28; } 
 .r-color-default { background-color: #4b5563; }
 .member-history-panel { display: none; margin-top: 12px; padding: 10px; border-top: 2px dashed #999; background: #fdfdfd; border-radius: 6px; height: auto !important; max-height: none !important; overflow: visible !important; }
 .member-history-panel.open { display: block !important; }

 .sm-table-container { width: 100%; overflow-x: auto; margin-top: 8px; border: 1px solid #999; border-radius: 4px; }
 .sm-table { width: 100%; border-collapse: collapse; font-size: 1.05rem; }
 .sm-table th, .sm-table td { padding: 8px 6px; border: 2px solid #666666; text-align: center; vertical-align: middle; color: #000000; }
 .sm-table th { background-color: #d5d5d5; font-weight: 900; color: #000000; }
 .sm-table td.col-bold { font-weight: 900; }
 .sm-table td.col-score { font-weight: 900; color: #c2185b; text-align: right; padding-right: 6px; font-size: 1.15rem; }
 .sm-table td.col-nums { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: bold; color: #000; font-size: 1.1rem; }
 </style>
</head>

 let currentTab = "team";
 const slashChar = String.fromCharCode(47);
 function switchTab(tabType) {
   currentTab = tabType;
   const btnTeam = document.getElementById("tab-team");
   const btnPlayer = document.getElementById("tab-player");
   const panelTeam = document.getElementById("team-panel");
   const panelPlayer = document.getElementById("player-panel");
   
   if (tabType === "team") {
     btnTeam.classList.add("active");
     btnPlayer.classList.remove("active");
     panelTeam.classList.add("active");
     panelPlayer.classList.remove("active");
   } else {
     btnTeam.classList.remove("active");
     btnPlayer.classList.add("active");
     panelTeam.className = "content-panel";
     panelPlayer.className = "content-panel active";
   }
   renderData(cachedData);
 }

 function renderData(data) {
   if (currentTab === "team") {
     renderTeamRanking(data.teamRankings || []);
   } else {
     renderPlayerRanking(data.playerRankings || []);
   }
 }
 function renderTeamRanking(rankings) {
   const chartContainer = document.getElementById("team-chart-container");
   const listContainer = document.getElementById("team-list-container");
   chartContainer.innerHTML = "";
   listContainer.innerHTML = "";
   
   if (!rankings || rankings.length === 0) {
     listContainer.innerHTML = "<p style='text-align:center; padding:20px; color:#888;'>記録がありません。</p>";
     chartContainer.style.display = "none";
     return;
   }
   
   chartContainer.style.display = "block";
   chartContainer.innerHTML = `<div class="chart-title"> チーム総得点 最終結果</div>`; 
   
   const maxTeamScore = Math.max(...rankings.map(t => t.totalScore || 1));
   let maxRound = cachedData.maxRound || 5;
   rankings.forEach(item => {
     let barSegmentsHtml = "";
     if (!item.roundDetails) item.roundDetails = {};
     
     for (let r = 1; r <= maxRound; r++) {
       const rScore = item.roundDetails[`R${r}`] || 0;
       if (rScore > 0 && item.totalScore > 0) {
         const percentInTeam = (rScore / item.totalScore) * 100;
         const colorClass = r === 1 ? 'r-color-1' : r === 2 ? 'r-color-2' : r === 3 ? 'r-color-3' : r === 4 ? 'r-color-4' : r === 5 ? 'r-color-5' : r === 6 ? 'r-color-6' : 'r-color-default';
         barSegmentsHtml += `<div class="bar-segment ${colorClass}" style="width: ${percentInTeam}%" title="R${r}: ${rScore}点"></div>`;
       }
     }
     const containerWidthPercent = (item.totalScore / maxTeamScore) * 100;
     const displayTeamName = item.teamName || (item.teamNo ? "チーム" + item.teamNo : '不明チーム');
     
     const chartRow = document.createElement("div");
     chartRow.className = "chart-row";
     chartRow.innerHTML = `
       <div class="chart-axis-label">${displayTeamName}</div>
       <div class="chart-bar-flex-group">
         <div class="chart-bar-area">
           <div class="stacked-bar-container" style="width: ${containerWidthPercent}%; display: flex;">
             ${barSegmentsHtml || '<div style="color: #444444; font-size: 0.95rem; font-weight: 900; padding-left: 8px; line-height: 28px;">未投球</div>'}
           </div>
         </div>
         <div class="chart-row-score">${item.totalScore || 0}点</div>
       </div>
     `;
     chartContainer.appendChild(chartRow);
   });
    rankings.forEach(item => {
     const card = document.createElement("div");
     card.className = "rank-card";
     
     let playerMapInTeam = {};
     let hasData = false;
     if (item.memberHistory && typeof item.memberHistory === "object") {
       Object.keys(item.memberHistory).sort().forEach(rKey => {
         const rawString = item.memberHistory[rKey];
         if (!rawString) return;
         const players = rawString.split(slashChar).map(p => p.trim());
         players.forEach(player => {
           if (!player) return;
           const match = player.match(/^(.+?)\((.+?)\)$/);
           if (match && match.length > 2) {
             const pName = match[1].trim(); 
             const pScore = parseInt(match[2], 10) || 0; 
             if (!playerMapInTeam[pName]) {
               playerMapInTeam[pName] = { scores: [], total: 0, count: 0 };
             }
             playerMapInTeam[pName].scores.push(pScore);
             playerMapInTeam[pName].total += pScore;
             playerMapInTeam[pName].count += 1;
           }
         });
       });
     }

     let originalHistoryHtml = '<div style="display: flex; flex-direction: column; gap: 6px; margin-top: 5px;">';
     Object.keys(playerMapInTeam).forEach(pName => {
       hasData = true;
       const pData = playerMapInTeam[pName];
       originalHistoryHtml += `
         <div class="player-row-in-team" style="margin-bottom: 8px; padding: 4px 0; border-bottom: 1px dotted #ccc;">
           <div style="font-size: 1.2rem; font-weight: 900; color: #111; margin-bottom: 2px;">${pName}</div>
           <div style="font-size: 1.1rem; color: #111; font-weight: bold; line-height: 1.4;">
             <span style="color: #444; font-size: 1rem; font-weight: 900; margin-right: 6px; background: #eee; padding: 1px 5px; border-radius: 3px;">履歴</span>
             <span style="font-size: 1.15rem; color: #000; letter-spacing: 0.5px;">${pData.scores.join(" " + slashChar + " ")}</span>
             <span style="color: #222; font-size: 1rem; font-weight: 900; margin-left: 8px; display: inline-block;">(${pData.count}試合 / 計 <span style="color: #008f00; font-size: 1.1rem;">${pData.total}点</span>)</span>
           </div>
         </div>`;
     });
     originalHistoryHtml += '</div>';
     if (!hasData) originalHistoryHtml = "<div style='padding:8px; font-weight:bold; color:#666;'>記録がありません。</div>";

     let compactTableHtml = `
       <div class="sm-table-container" style="margin-top: 15px; border-top: 1px dashed #ccc; padding-top: 12px;">
         <div style="font-size: 1.1rem; font-weight: 900; color: #111; margin-bottom: 6px;"> チーム回戦別履歴確認表</div>
         <table class="sm-table">
           <thead>
             <tr><th style="width: 25%;">チーム</th><th style="width: 10%;">回</th><th style="width: 20%;">合計</th><th style="width: 45%;">5人の内訳</th></tr>
           </thead>
           <tbody>
     `;

     if (item.memberHistory && typeof item.memberHistory === "object") {
       for (let r = 1; r <= maxRound; r++) {
         const roundKey = `R${r}`;
         const roundScore = item.roundDetails[roundKey] !== undefined ? item.roundDetails[roundKey] : "-";
         const rawString = item.memberHistory[roundKey] || "";
         let scoreOnlyLine = "-";
         if (rawString) {
           const scores = [];
           const regex = new RegExp("\\(([^)]+)\\)", "g");
           let match;
           while ((match = regex.exec(rawString)) !== null) {
             if (match && match.length > 1) scores.push(match[1].trim());
           }
           if (scores.length > 0) scoreOnlyLine = scores.join(slashChar);
         }
         compactTableHtml += `
           <tr>
             <td class="col-bold" style="text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:70px;">${item.teamName || '不明'}</td>
             <td>${r}</td>
             <td class="col-score">${roundScore}${typeof roundScore === 'number' ? '点' : ''}</td>
             <td class="col-nums" style="white-space: nowrap;">${scoreOnlyLine}</td>
           </tr>`;
       }
     }
     compactTableHtml += `</tbody></table></div>`;

     card.innerHTML = `
       <div class="card-main-content">
         <div class="rank-num ${getRankClass(item.rank)}">${getRankFormat(item.rank)}</div>
         <div class="info-box"><div class="name-container"><span class="team-tag">${item.teamName || '不明'}</span></div></div>
         <div class="score-box"><span class="score-num">${item.totalScore || 0}</span><span class="score-unit">点</span></div>
       </div>
       <div class="member-history-panel">
         <div style="font-size: 1.1rem; font-weight: 900; color: #000; margin-bottom: 8px; border-left: 5px solid #008f00; padding-left: 8px;"> チーム内個人の総合成績</div>
         ${originalHistoryHtml}
         ${compactTableHtml}
       </div>
     `;
     card.addEventListener("click", () => {
       const panel = card.querySelector(".member-history-panel");
       if (panel) panel.classList.toggle("open");
     });
     listContainer.appendChild(card);
   });
 }

 function renderPlayerRanking(rankings) {
   const panel = document.getElementById("player-panel");
   panel.innerHTML = "";
   if (rankings.length === 0) {
     panel.innerHTML = "<p style='text-align:center; padding:20px; color:#888;'>記録がありません。</p>";
     return;
   }
   rankings.forEach(item => {
     const card = document.createElement("div");
     card.className = "rank-card";
     card.style.cursor = "default";
     const displayTeamName = item.teamName || (item.teamNo ? "チーム" + item.teamNo : '不明');
     let cleanHistory = item.historyStr || '-';
     if (typeof cleanHistory === "string") {
       const spaceRegex = new RegExp("\\s*\\x2f\\s*", "g");
       cleanHistory = cleanHistory.replace(spaceRegex, slashChar);
     }
     card.innerHTML = `
       <div class="card-main-content">
         <div class="rank-num ${getRankClass(item.rank)}">${getRankFormat(item.rank)}</div>
         <div class="info-box">
           <div class="name-container">
             <span class="name-main">${item.playerName || '不明'}</span>
             <span class="team-tag">${displayTeamName}</span>
           </div>
           <div style="font-size: 1.05rem; color: #444; font-weight: 900; margin-top: 4px; margin-bottom: 2px; line-height: 1;">
             履歴 (${item.gameCount || 0} 試合)
           </div>
           <div style="font-size: 1.25rem; color: #000; font-weight: 900; letter-spacing: -0.5px; line-height: 1.2; white-space: nowrap;">
             ${cleanHistory}
           </div>
         </div>
         <div class="score-box">
           <span class="score-num">${item.totalScore || 0}</span>
           <span class="score-unit">点</span>
         </div>
       </div>
     `;
     panel.appendChild(card);
   });
 }

 function getRankClass(rank) {
   if (rank === 1) return "rank-1"; 
   if (rank === 2) return "rank-2"; 
   if (rank === 3) return "rank-3"; 
   return "";
 }

 function getRankFormat(rank) {
   if (rank === 1) return "🥇"; 
   if (rank === 2) return "🥈"; 
   if (rank === 3) return "🥉"; 
   return `${rank}位`;
 }

 function initApp() {
   document.getElementById("tab-team").addEventListener("click", () => switchTab("team"));
   document.getElementById("tab-player").addEventListener("click", () => switchTab("player"));
   renderData(cachedData);
 }
 document.addEventListener("DOMContentLoaded", initApp);
 </script>
